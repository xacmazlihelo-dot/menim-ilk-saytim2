<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mənim Saytım</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #ff9a56 0%, #ff6a88 50%, #a855f7 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 24px;
    padding: 50px 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 25px 70px rgba(0,0,0,0.25);
  }
  .icon { font-size: 56px; margin-bottom: 20px; }
  h1 { color: #1e1b2e; font-size: 28px; margin-bottom: 14px; }
  p { color: #64748b; font-size: 16px; line-height: 1.7; margin-bottom: 24px; }
  .tags { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .tag {
    background: #fef3f2;
    color: #e11d48;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }
  .footer { margin-top: 28px; font-size: 13px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🎯</div>
    <h1>Növbəti sınağım!</h1>
    <p>Bu sayt sıfırdan, öz əllərimlə GitHub-a yüklənib, Azure-a qoşulub. Hər dəfə bir az daha inamlı oluram.</p>
    <div class="tags">
      <span class="tag">Azure</span>
      <span class="tag">GitHub</span>
      <span class="tag">Öz layihəm</span>
    </div>
    <div class="footer">2026</div>
  </div>
</body>
</html>
