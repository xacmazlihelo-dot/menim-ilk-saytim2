<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haqqımda</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container { max-width: 600px; width: 100%; }
  .avatar {
    width: 90px; height: 90px;
    background: linear-gradient(135deg, #22d3ee, #6366f1);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    margin: 0 auto 24px;
  }
  h1 { text-align: center; font-size: 32px; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #94a3b8; margin-bottom: 40px; font-size: 16px; }
  .skills {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 40px;
  }
  .skill {
    background: #1e293b;
    border: 1px solid #334155;
    color: #22d3ee;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 24px;
    text-align: center;
  }
  .card p { line-height: 1.7; color: #cbd5e1; }
  .footer { text-align: center; margin-top: 30px; color: #64748b; font-size: 13px; }
</style>
</head>
<body>
  <div class="container">
    <div class="avatar">👋</div>
    <h1>Salam, mən Azure öyrənirəm!</h1>
    <p class="subtitle">Sıfırdan bulud texnologiyalarına doğru</p>

    <div class="skills">
      <span class="skill">☁️ Azure</span>
      <span class="skill">🐙 GitHub</span>
      <span class="skill">🌐 Static Web Apps</span>
      <span class="skill">📚 Öyrənmə davam edir</span>
    </div>

    <div class="card">
      <p>Bu sayt Azure Static Web Apps və GitHub Actions vasitəsilə avtomatik canlıya çıxıb. Hər dəfə GitHub-da faylı dəyişəndə, sayt özü yenilənir!</p>
    </div>

    <div class="footer">2026-cı ildə hazırlanıb</div>
  </div>
</body>
</html>
